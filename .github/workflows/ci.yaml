name: CI

on:
  push:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pre-commit checks
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: "--all-files --refresh"

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Set up Python
        run: |
          uv python install
          uv sync --frozen

      - name: Render resume
        run: |
          uv run \
            rendercv render \
              src/cv.yaml \
              --dont-generate-html \
              --dont-generate-markdown \
              --dont-generate-png

      - name: Create artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: src/rendercv_output/gabriele_bocchi_resume.pdf
          archive: false

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: src/rendercv_output/gabriele_bocchi_resume.pdf
