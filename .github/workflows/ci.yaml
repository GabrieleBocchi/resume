name: CI

on:
  push:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run pre-commit checks
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          extra-args: "--all-files --refresh"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        run: |
          uv python install
          uv sync --frozen

      - name: Render resume
        run: |
          uv run \
            rendercv render \
              src/cv.yaml \
              --dont-generate-html \
              --dont-generate-markdown \
              --dont-generate-png

      - name: Create artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: src/rendercv_output/gabriele_bocchi_resume.pdf
          archive: false

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: src/rendercv_output/gabriele_bocchi_resume.pdf
